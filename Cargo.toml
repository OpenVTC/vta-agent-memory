[package]
name = "vta-agent-memory"
version = "0.2.0"
edition = "2024"
rust-version = "1.95.0"
description = "Agentic memory for Claude Code, stored in a Verifiable Trust Agent"
license = "Apache-2.0"
repository = "https://github.com/OpenVTC/vta-agent-memory"
publish = false

# A library as well as a binary, so `tests/` can drive the store against the
# SDK's in-process loopback transport instead of needing a live VTA.
[lib]
name = "vta_agent_memory"
path = "src/lib.rs"

[[bin]]
name = "vta-agent-memory"
path = "src/main.rs"

[dependencies]
# The whole reason this repo is thin: `VtaClient::memory_{put,list,delete}`
# already drive `vta/memory/*` through the generic Trust-Task dispatcher, which
# picks TSP > DIDComm > REST from what both DID documents advertise. Nothing
# here is transport-aware.
vta-sdk = { version = "0.31", features = [
  "client",
  "session",
  "didcomm",
  "tsp",
  "provision-client",
  "crypto-provider",
  "keyring",
  # Without this the mediator is never told which message types to accept for
  # this client's DID and silently drops them. `vta-mcp` learned this the hard
  # way; the comment there is worth reading before removing it here.
  "acl-setup",
] }

# The ephemeral did:key -> ACL grant -> auto-rotate-on-first-connect flow that
# the mediator, PNM and did-hosting already share. `onboarding` pulls only
# vta-sdk's session machinery, which is already here.
vti-secrets = { version = "0.3", default-features = false, features = ["onboarding"] }

rmcp = { version = "3", features = ["server", "transport-io", "macros", "schemars"] }
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dirs = "6"
# Reads `pnm`'s own config.toml — `pnm-cli` is a binary crate with no library
# target, so there is nothing to depend on for the slug -> VTA-DID mapping.
toml = "0.9"
# Fence nonces (`fence.rs`). A fixed delimiter is a forgeable one, so each
# render mints a fresh random nonce from the OS RNG — never a time seed.
# Already in the graph transitively; named here because we call it directly.
getrandom = "0.4"

[dev-dependencies]
tempfile = "3"
# `test-loopback` answers the Trust-Task surface in-process, so the integration
# tests exercise the real payloads `memory_{put,list,delete}` build without a
# VTA, a mediator, or a socket. Additive and zero-cost outside tests.
vta-sdk = { version = "0.31", features = ["test-loopback"] }
