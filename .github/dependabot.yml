# Keep dependency pins current without giving up the pins.
#
# `ci.yml` pins every action to a commit SHA. Dependabot rewrites the SHA and
# its trailing version comment together, so pinning does not mean freezing.
#
# `cooldown` holds a new release back for a week before it is proposed. A
# hijacked or re-tagged release is usually noticed and pulled within days;
# waiting keeps it from arriving here as a routine bump first. Security updates
# are not delayed by it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Patch releases travel together. Minor bumps stay separate: for the 0.x
    # `vta-sdk` family a minor bump is a breaking one and needs its own review.
    groups:
      cargo-patch:
        update-types: ["patch"]
    commit-message:
      prefix: "chore(deps)"
