# Build, test and lint every push and pull request.
#
# This repo shipped eight PRs with no CI at all — only a DCO check — and the
# ninth had to fix a `main` that did not compile. Two PRs edited the same test
# module from branches that did not know about each other; git merged them
# cleanly because the blocks were textually distinct, and the result referenced
# an enum variant the other PR had deleted. Nothing noticed until somebody ran
# `cargo test` locally.
#
# That is precisely the failure a semantic check catches and a textual merge
# cannot, so it runs on `merge_group` too: a PR that was green on its own branch
# can still break `main` when combined with another.
#
# Supply chain. The plugin is installed by cloning `main`, and its binary runs
# at every Claude Code session start, so whatever can write to `main` can run
# code on every installing machine. Two consequences for this file:
#
# - Every third-party action is pinned to a full commit SHA, with the release it
#   corresponds to in a trailing comment. A tag or branch can be moved to new
#   code after review; a commit SHA cannot. Dependabot
#   (`.github/dependabot.yml`) proposes the bumps, and the `workflow hygiene`
#   job below fails on any `uses:` that is not pinned.
# - The default token is read-only, and checkouts do not keep it in
#   `.git/config`. Nothing here pushes, comments or publishes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Warnings are failures here. This crate's whole argument is that a memory
  # service has to be trustworthy about what it does and does not know; a
  # tolerated warning is a small lie about that.
  RUSTFLAGS: -D warnings
  # The toolchain CI builds with. Kept equal to `rust-version` in Cargo.toml,
  # so the version the README promises is the one that is actually tested; the
  # install step fails if the two drift apart.
  RUST_TOOLCHAIN: 1.95.0

jobs:
  test:
    name: test
    # macOS on purpose. Two shipped bugs were platform-specific paths —
    # `pnm` stores its config under `dirs::config_dir()`, which is
    # `~/Library/Application Support` here and `~/.config` on Linux — and a
    # Linux-only matrix would have been green through both.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # rustup ships on the hosted runners, so no third-party action is needed
      # to pick a toolchain — and a pinned version is explicit here rather than
      # implied by an action's branch name.
      - name: Install Rust
        run: |
          grep -qx "rust-version = \"${RUST_TOOLCHAIN}\"" Cargo.toml \
            || { echo "::error file=Cargo.toml::rust-version does not match RUST_TOOLCHAIN (${RUST_TOOLCHAIN}) in ci.yml"; exit 1; }
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt,clippy
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version

      # The `[patch.crates-io]` git dependency on the VTI workspace is a large
      # fetch and a long build; caching it is the difference between a usable
      # CI and one people learn to ignore. Only `main` writes the cache, so a
      # pull request can read it but cannot seed what later runs restore.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Test
        run: cargo test --all-features

  workflows:
    name: workflow hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # A mutable `uses:` ref added later would quietly undo the pinning above,
      # and nothing else would notice. Local actions (`./…`) are part of this
      # repo and exempt; a `docker://` image must be pinned by digest.
      - name: Check every action is pinned to a commit SHA
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          uses = re.compile(r"""^\s*(?:-\s*)?uses:\s*["']?([^"'\s#]+)""")
          sha = re.compile(r"^[^@\s]+@[0-9a-f]{40}$")
          digest = re.compile(r"^docker://[^@\s]+@sha256:[0-9a-f]{64}$")
          bad = False
          files = sorted(pathlib.Path(".github").rglob("*.yml")) + sorted(pathlib.Path(".github").rglob("*.yaml"))
          for f in files:
              for n, line in enumerate(f.read_text().splitlines(), 1):
                  m = uses.match(line)
                  if not m:
                      continue
                  ref = m.group(1)
                  if ref.startswith("./"):
                      continue
                  ok = digest.match(ref) if ref.startswith("docker://") else sha.match(ref)
                  if not ok:
                      print(f"::error file={f},line={n}::`{ref}` is not pinned to a full commit SHA")
                      bad = True
                  else:
                      print(f"ok {f}:{n} {ref}")
          sys.exit(1 if bad else 0)
          PY

      # Without a top-level block a workflow inherits the repository default,
      # which can be a write token.
      - name: Check every workflow declares its token permissions
        run: |
          fail=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -e "$f" ] || continue
            grep -q '^permissions:' "$f" \
              || { echo "::error file=$f::no top-level permissions: block"; fail=1; }
          done
          exit $fail

  plugin:
    name: plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # The manifests are what a person meets before any Rust runs. A malformed
      # `plugin.json` or `.mcp.json` breaks the plugin without breaking the
      # build, so the build alone would never report it.
      - name: Validate JSON manifests
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json \
                   .mcp.json hooks/hooks.json; do
            echo "checking $f"
            python3 -c "import json,sys; json.load(open('$f'))"
          done

      # The shim at bin/ is what `.mcp.json` and the hook actually invoke. It
      # must be committed and executable: a marketplace install is a fresh
      # clone with no build artifacts, so if this file is ever gitignored
      # again — as it was — the plugin installs and does nothing.
      - name: Check the launcher shim is committed and executable
        run: |
          test -x bin/vta-agent-memory \
            || { echo "::error::bin/vta-agent-memory missing or not executable"; exit 1; }
          git ls-files --error-unmatch bin/vta-agent-memory > /dev/null \
            || { echo "::error::bin/vta-agent-memory is not tracked by git"; exit 1; }
          mode=$(git ls-files -s bin/vta-agent-memory | cut -d' ' -f1)
          test "$mode" = "100755" \
            || { echo "::error::bin/vta-agent-memory has git mode $mode, expected 100755"; exit 1; }

      # The paths those manifests point at must exist in a fresh clone, which is
      # exactly what a marketplace install gives you.
      - name: Check manifest paths resolve in a clean checkout
        run: |
          fail=0
          for f in .mcp.json hooks/hooks.json; do
            python3 - "$f" <<'PY' || fail=1
          import json, os, re, sys
          raw = open(sys.argv[1]).read()
          for path in re.findall(r'\$\{CLAUDE_PLUGIN_ROOT\}/([^"\s]+)', raw):
              if not os.path.exists(path):
                  print(f"::error file={sys.argv[1]}::{path} does not exist in a clean checkout")
                  sys.exit(1)
              print(f"ok {sys.argv[1]} -> {path}")
          PY
          done
          exit $fail

      # Every command and skill needs frontmatter to be loaded at all; a missing
      # `description` makes a command invisible rather than broken.
      - name: Check command and skill frontmatter
        run: |
          fail=0
          for f in commands/*.md skills/*/SKILL.md; do
            if ! head -1 "$f" | grep -q '^---$'; then
              echo "::error file=$f::missing YAML frontmatter"; fail=1; continue
            fi
            if ! sed -n '2,/^---$/p' "$f" | grep -q '^description:'; then
              echo "::error file=$f::frontmatter has no description"; fail=1
            fi
          done
          exit $fail
